<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Shot Analyzer</title><style>body{font-family:system-ui,Arial,sans-serif;margin:0;padding:24px;background:#0b1220;color:#e8edf7;}h1{margin:0 0 12px;}label{display:block;margin-top:14px;font-weight:600;}input,button,pre{font:inherit;}input[type=text],input[type=file]{width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid #2a426e;background:#0a152c;color:#e8edf7;}button{margin-top:18px;width:100%;padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer;background:#4c6fff;color:#0b1220;}pre{white-space:pre-wrap;background:#0a152c;border:1px solid #2a426e;border-radius:12px;padding:14px;margin-top:18px;} .card{max-width:720px;margin:0 auto;background:#0f1d3a;border:1px solid #20355d;border-radius:14px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.4);} .progress{margin-top:18px;height:12px;background:#0a152c;border-radius:12px;border:1px solid #2a426e;overflow:hidden;} .fill{height:100%;width:0;background:#4c6fff;} .sub{margin-top:8px;opacity:.85;} .error{margin-top:12px;color:#ff6b6b;font-family:monospace;}</style></head><body><div class="card"><h1>Shoot Lab</h1><p>Upload a video and use Gemini to analyze it (backend uses /api/analyze).</p><label>Gemini API Key</label><input id="apiKey" type="text" placeholder="AIza..."/><label>Video file</label><input id="fileInput" type="file" accept="video/*"/><button id="analyzeBtn">Analyze</button><div class="progress" id="progress" style="display:none;"><div class="fill" id="progressFill"></div></div><div class="sub" id="status" style="display:none;"></div><div class="error" id="err" style="display:none;"></div><pre id="out" style="display:none;"></pre></div><script>let videoFile=null;function setProgress(p,msg){document.getElementById('progress').style.display='block';document.getElementById('status').style.display='block';document.getElementById('progressFill').style.width=Math.min(p,100)+'%';document.getElementById('status').textContent=msg||'';}function showError(msg){const el=document.getElementById('err');el.style.display='block';el.textContent='// '+msg;}function hideOutput(){document.getElementById('out').style.display='none';document.getElementById('err').style.display='none';}document.getElementById('fileInput').addEventListener('change',e=>{videoFile=e.target.files&&e.target.files[0]?e.target.files[0]:null;});document.getElementById('analyzeBtn').addEventListener('click',async()=>{hideOutput();const apiKey=document.getElementById('apiKey').value.trim();if(!apiKey)return showError('Enter API key');if(!videoFile)return showError('Select a video');if(videoFile.size>100*1024*1024)return showError('Video too large (>100MB)');try{setProgress(5,'Uploading...');const formData=new FormData();formData.append('apiKey',apiKey);formData.append('video',videoFile);formData.append('prompt','Analyze this lacrosse shooting video and return JSON only with scores, findings, and drills.');const res=await fetch('/api/analyze',{method:'POST',body:formData});setProgress(90,'Parsing response...');const data=await res.json();if(!res.ok)throw new Error(data.error||'Analysis failed');const rawText=data.text||'';let parsed;try{parsed=JSON.parse(rawText.replace(/```json|```/g,'').trim());}catch{parsed={text:rawText};}const out=document.getElementById('out');out.style.display='block';out.textContent=JSON.stringify(parsed,null,2);setProgress(100,'Done');}catch(e){showError(e.message);}});</script></body></html>
