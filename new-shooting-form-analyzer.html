<script>
let videoFile = null;
const CHUNK_SIZE = 5 * 1024 * 1024;

const fileInput = document.getElementById('fileInput');

function handleFile(input) {
  if (input.files && input.files[0]) setFile(input.files[0]);
}

function setFile(f) {
  videoFile = f;
  const mb = (f.size / 1024 / 1024).toFixed(0);
  const el = document.getElementById('fileChosen');
  el.textContent = '✓ ' + f.name + ' (' + mb + ' MB)';
  el.style.display = 'block';
}

function setProgress(pct, title, sub) {
  document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
  document.getElementById('progressPct').textContent = Math.round(Math.min(pct, 100)) + '%';
  if (title) document.getElementById('progressTitle').textContent = title;
  if (sub) document.getElementById('progressSub').textContent = sub;
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = '// ' + msg;
  el.style.display = 'block';
}

async function initiateUpload(apiKey, file) {
  const formData = new FormData();
formData.append("apiKey", apiKey);
formData.append("video", videoFile);
formData.append("prompt", prompt);

const res = await fetch("/api/analyze", {
  method: "POST",
  body: formData
});
  );

  if (!res.ok) throw new Error('Failed to initiate upload');
  const uploadUrl = res.headers.get('X-Goog-Upload-URL');
  if (!uploadUrl) throw new Error('No upload URL returned');
  return uploadUrl;
}

async function uploadChunked(uploadUrl, file, onProgress) {
  let offset = 0;
  let fileUri = null;

  while (offset < file.size) {
    const end = Math.min(offset + CHUNK_SIZE, file.size);
    const chunk = file.slice(offset, end);
    const isLast = end === file.size;

    const res = await fetch(uploadUrl, {
      method: 'POST',
      headers: {
        'Content-Length': chunk.size,
        'X-Goog-Upload-Offset': offset,
        'X-Goog-Upload-Command': isLast ? 'upload, finalize' : 'upload',
      },
      body: chunk
    });

    if (!res.ok && res.status !== 308) {
      throw new Error('Upload failed');
    }

    offset = end;
    onProgress(offset / file.size);

    if (isLast) {
      const data = await res.json();
      fileUri = data.file?.uri;
    }
  }

  return fileUri;
}

async function waitForFile(apiKey, fileUri) {
  const fileName = fileUri.split('/').pop();

  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 3000));

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/files/${fileName}?key=${apiKey}`
    );

    if (!res.ok) continue;

    const data = await res.json();

    if (data.state === 'ACTIVE') return;
    if (data.state === 'FAILED') throw new Error('File processing failed');
  }

  throw new Error('File processing timeout');
}

async function startAnalysis() {
  document.getElementById('errorMsg').style.display = 'none';

  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) return showError('Enter API key');
  if (!videoFile) return showError('Select a video');

  // size protection
  if (videoFile.size > 100 * 1024 * 1024) {
    return showError('Video too large — keep under ~100MB');
  }

  document.getElementById('setupSection').style.display = 'none';
  document.getElementById('progressSection').style.display = 'block';

  try {
    setProgress(5, 'Uploading...');
    const uploadUrl = await initiateUpload(apiKey, videoFile);

    const fileUri = await uploadChunked(uploadUrl, videoFile, (p) => {
      setProgress(5 + p * 55);
    });

    setProgress(65, 'Processing...');
    await waitForFile(apiKey, fileUri);

    setProgress(75, 'Analyzing...');

    const prompt = `Analyze this lacrosse shooting video and return JSON only with scores, findings, and drills.`;

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [
            {
              role: "user",
              parts: [{ text: prompt }]
            },
            {
              role: "user",
              parts: [{
                fileData: {
                  mimeType: videoFile.type || 'video/mp4',
                  fileUri: fileUri
                }
              }]
            }
          ],
          generationConfig: {
            temperature: 0.25,
            maxOutputTokens: 3000
          }
        })
      }
    );

    if (!res.ok) throw new Error('Analysis failed');

    const data = await res.json();

    if (!data.candidates || !data.candidates.length) {
      throw new Error("No response from Gemini");
    }

    const text = data.candidates[0].content.parts[0].text;

    let parsed;
    try {
      parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
    } catch {
      parsed = { mechanics_breakdown: text };
    }

    setProgress(100, 'Done');

    setTimeout(() => renderReport(parsed), 400);

  } catch (e) {
    document.getElementById('progressSection').style.display = 'none';
    document.getElementById('setupSection').style.display = 'block';
    showError(e.message);
  }
}
</script>
